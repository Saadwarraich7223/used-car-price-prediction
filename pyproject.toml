[project]
name = "used-car-price-prediction"
version = "0.1.0"
description = "Predict used car selling prices from vehicle attributes (Cardekho dataset)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Muhammad Saad", email = "saadwarraich7223@gmail.com" },
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
